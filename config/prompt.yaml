            if i < len(b):
                val += int(b[-(i + 1)])
            carry, val = divmod(val, 2)
            result += str(val)
        if carry:
            result += str(carry)
        return result[::-1]
        What is the Time Complexity?"
          Answer2: "O(n)"
          Question3: "class Solution2(object):
    def arrayPairSum(self, nums):
        nums.sort()
        result = 0
        for i in xrange(0, len(nums), 2):
