      PromptTemplate: "Given a code snippet <CODE>, calculate its space complexity."
      OutputFormatTemplate: "{\"answer\":  O(1)}"
      Example: 
          Question1: "class Solution(object):
    def sum(self, num1, num2):
        return num1+num2
        What is the Space Complexity?"
          Answer1: "O(1)"
          Question2: "class Solution(object):
    def addBinary(self, a, b):
        result, carry, val = "", 0, 0
        for i in xrange(max(len(a), len(b))):
            val = carry
            if i < len(a):
                val += int(a[-(i + 1)])
            if i < len(b):
                val += int(b[-(i + 1)])
            carry, val = divmod(val, 2)
            result += str(val)
        if carry:
            result += str(carry)
        return result[::-1]
        What is the Space Complexity?"
          Answer2: "O(1)"
          Question3: "class Solution2(object):
    def arrayPairSum(self, nums):
        nums.sort()
        result = 0
